# Monthly: pull new BPS headline releases into data/bps_reference.csv, re-run the tests, and open a PR.
# A PR (not a direct commit) so a person checks every new official number before it becomes ground truth.
name: update-bps
on:
  schedule:
    - cron: "0 3 6 * *"   # 6th of each month, 10:00 WIB: after BPS's first-working-day inflation release
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run playwright install --with-deps chromium
      - run: uv run python src/update_bps.py --pages 3
      - run: uv run python tests/test_pipeline.py
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/update-bps
          title: "BPS reference: new releases"
          commit-message: "data: append new BPS releases (bps_listing_auto)"
          body: |
            Rows appended by `src/update_bps.py` from BRS titles (provenance `bps_listing_auto`).
            Please open each `source_url` and confirm the value before merging.
            Stored verdicts are recomputed from this table, so no model rerun is needed.
